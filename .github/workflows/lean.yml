name: Lean 4 CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Lean
        uses: leanprover/lean-action@v1
        with:
          build: "false"

      - name: Check main.lean
        run: lake env lean main.lean
