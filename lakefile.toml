name = "antigrav"
version = "0.1.0"
defaultTargets = ["Antigrav"]

[[lean_lib]]
name = "Antigrav"
# RhinBridge imports Erdos1135.ND.PhaseGap; both must be package modules
# so `lake build Antigrav` and `lake env lean RhinBridge.lean` resolve them.
roots = ["RhinBridge"]
globs = ["RhinBridge", "Erdos1135.+"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.1"

[[lean_lib]]
name = "Prove2MeCore"
# Deliberately excludes RhinBridge and main: this is the compatibility kernel.
roots = ["Prove2MeBridge"]
globs = ["Prove2MeBridge", "Antigrav.Prove2Me.+"]
